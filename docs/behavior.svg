<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="title desc">
  <title id="title">A tall panel pins to the bottom, then to the top</title>
  <desc id="desc">While the page scrolls down the panel pins to the bottom offset. While the page scrolls up it pins to the top offset.</desc>
  <style>
    .panel { animation: panel 9s linear infinite; }
    .thumb { animation: thumb 9s linear infinite; }
    .label-flow { animation: label-flow 9s linear infinite; }
    .label-bottom { animation: label-bottom 9s linear infinite; }
    .label-top { animation: label-top 9s linear infinite; }
    @keyframes panel {
      0%, 18% { transform: translateY(0); }
      40%, 55% { transform: translateY(-136px); }
      78%, 92% { transform: translateY(16px); }
      100% { transform: translateY(0); }
    }
    @keyframes thumb {
      0%, 18% { transform: translateY(0); }
      40%, 55% { transform: translateY(78px); }
      78%, 92% { transform: translateY(24px); }
      100% { transform: translateY(0); }
    }
    @keyframes label-flow {
      0%, 16% { opacity: 1; }
      22%, 100% { opacity: 0.28; }
    }
    @keyframes label-bottom {
      0%, 28% { opacity: 0.28; }
      40%, 55% { opacity: 1; }
      64%, 100% { opacity: 0.28; }
    }
    @keyframes label-top {
      0%, 64% { opacity: 0.28; }
      78%, 92% { opacity: 1; }
      98%, 100% { opacity: 0.28; }
    }
  </style>
  <rect width="680" height="400" fill="#f4f7f8"/>
  <rect x="36" y="28" width="300" height="344" rx="12" fill="#ffffff" stroke="#d5dee2"/>
  <rect x="36" y="28" width="300" height="32" rx="12" fill="#e7eeef"/>
  <rect x="36" y="48" width="300" height="12" fill="#e7eeef"/>
  <circle cx="56" cy="44" r="4" fill="#94a3b8"/>
  <circle cx="72" cy="44" r="4" fill="#94a3b8"/>
  <circle cx="88" cy="44" r="4" fill="#94a3b8"/>
  <clipPath id="viewport">
    <rect x="48" y="72" width="276" height="280"/>
  </clipPath>
  <g clip-path="url(#viewport)">
    <rect x="60" y="84" width="140" height="10" rx="2" fill="#e2e8f0"/>
    <rect x="60" y="106" width="120" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="60" y="124" width="132" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="60" y="142" width="100" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="228" y="60" width="80" height="420" rx="6" fill="#0f766e" class="panel"/>
  </g>
  <line x1="48" y1="88" x2="324" y2="88" stroke="#0f766e" stroke-dasharray="3 4" stroke-width="1"/>
  <line x1="48" y1="336" x2="324" y2="336" stroke="#0f766e" stroke-dasharray="3 4" stroke-width="1"/>
  <rect x="318" y="80" width="4" height="120" rx="2" fill="#e2e8f0"/>
  <rect x="318" y="80" width="4" height="28" rx="2" fill="#64748b" class="thumb"/>
  <text x="380" y="120" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" class="label-flow">flow</text>
  <text x="380" y="156" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" class="label-bottom">bottom</text>
  <text x="380" y="192" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" class="label-top">top</text>
  <text x="380" y="248" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Dashed lines are</text>
  <text x="380" y="268" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">--sticky-aside-top</text>
  <text x="380" y="288" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">and --sticky-aside-bottom.</text>
</svg>
