<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="sticky-aside">
  <style>
    .bg { fill: #d5e2e8; }
    .ink { fill: #142229; }
    .muted { fill: #142229; opacity: 0.28; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #141210; }
      .ink { fill: #f3ece3; }
      .muted { fill: #f3ece3; opacity: 0.28; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <rect class="ink" x="5" y="5" width="8" height="22" rx="2"/>
  <rect class="muted" x="16" y="5" width="11" height="5" rx="1.5"/>
  <rect class="muted" x="16" y="13" width="11" height="4" rx="1.5"/>
  <rect class="muted" x="16" y="20" width="8" height="4" rx="1.5"/>
</svg>
